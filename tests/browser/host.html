<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host di prova</title>
<style>html,body{margin:0;padding:0;background:#fff} iframe{width:100%;border:0;display:block;min-height:200px}</style></head>
<body>
<iframe id="f1" title="Embed di prova" loading="eager"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('f1').src = q.get('src');
  window.__msgs = [];
  window.addEventListener('message', e => { if (e.data && e.data.source === 'radar-midterm') window.__msgs.push({ h: e.data.height, t: Date.now() }); });
</script>
<script src="/embed/parent.js"></script>
</body></html>
