name: geo-build
# Costruisce i confini dei distretti 2026 dai file ufficiali del Census (il sandbox di sviluppo non raggiunge census.gov)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save mapshaper@0.6.100
      - run: pip install shapely
      - run: python scripts/geo/build_districts.py
      - name: Salva i risultati sul branch geo-build
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          rm -rf /tmp/geoout && cp -r geo_out /tmp/geoout
          git checkout --orphan geo-build-tmp && git rm -rf -q . 2>/dev/null || true
          mkdir -p geo && cp -r /tmp/geoout/. geo/ && git add geo
          git commit -qm "geo-build $(date -u +%FT%TZ)" && git push -f origin geo-build-tmp:geo-build
