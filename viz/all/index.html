<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midterm USA 2026 – Tutte le dataviz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../_shared/base.css">
<style>
  /* Pagina contenitore (non è un embed): può scorrere, ma gli iframe interni seguono il loro contenuto */
  html, body { overflow: auto; }
  .page { max-width: 1100px; margin: 0 auto; padding: 8px 0 24px; }
  .page h1 { font-size: 26px; margin: 16px 16px 4px; }
  .page .lead { margin: 0 16px 12px; color: var(--c-muted); font-size: 14px; }
  .page section { margin-top: 8px; border-top: 1px solid var(--c-border); }
  .page iframe { width: 100%; border: 0; display: block; min-height: 260px; }
  .page h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--c-muted); margin: 16px 16px 0; }
</style>
</head>
<body>
<main class="page">
  <h1>Midterm USA 2026</h1>
  <p class="lead">Risultati non ufficiali. Fonte: civicAPI (civicapi.org)</p>
  <section><iframe src="../balance/" title="Equilibrio dei poteri: Camera, Senato e governatori" loading="lazy" style="min-height:420px"></iframe></section>
  <section><iframe src="../map-states/" title="Mappa degli stati: Senato e governatori" loading="lazy" style="min-height:520px"></iframe></section>
  <section><iframe src="../map-house/" title="Mappa dei 435 distretti della Camera" loading="lazy" style="min-height:520px"></iframe></section>
  <section><iframe src="../house-list/" title="Lista dei distretti della Camera" loading="lazy" style="min-height:520px"></iframe></section>
</main>
<script src="../../embed/parent.js"></script>
<script>
  /* ?theme=dark|light sulla pagina si inoltra agli iframe (altrimenti seguono il tema del dispositivo) */
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'dark' && t !== 'light') return;
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('iframe').forEach(function (f) { f.src = f.getAttribute('src') + '?theme=' + t; });
  })();
</script>
</body>
</html>
